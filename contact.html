<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Contact - Smart Deal Hub</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#222}
header,footer{background:#111827;color:#fff;text-align:center;padding:20px}
main{max-width:800px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
label{display:block;margin:12px 0 6px}
input,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px}
button{margin-top:15px;padding:12px 20px;border:none;background:#2563eb;color:#fff;border-radius:8px;cursor:pointer}
a{color:#2563eb;text-decoration:none}
</style>
</head>
<body>
<header><h1>Contact Smart Deal Hub</h1></header>
<main>
<h2>Get in Touch</h2>
<p>Have a question, suggestion, or business inquiry? We'd love to hear from you.</p>
<form onsubmit="event.preventDefault();alert('Thank you! Your message has been received.');this.reset();">
<label>Name</label>
<input type="text" required>
<label>Email</label>
<input type="email" required>
<label>Message</label>
<textarea rows="6" required></textarea>
<button type="submit">Send Message</button>
</form>
<p style="margin-top:20px;"><a href="index.html">← Back to Home</a></p>
</main>
<footer>© 2026 Smart Deal Hub</footer>
</body>
</html>
